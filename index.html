<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Treasure Hunt - Route Lab</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:#0b1120;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh}.top{width:100%;max-width:620px;background:#151e32;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #facc15;position:sticky;top:0;z-index:20}.badge{background:#0b1120;border:2px solid #facc15;padding:6px 14px;border-radius:12px;font-weight:800}.badge span{color:#facc15}.badge2{border-color:#38bdf8}.badge2 span{color:#38bdf8}#grid{display:grid;grid-template-columns:repeat(10,42px);gap:5px;background:#151e32;padding:14px;border-radius:18px;margin-top:16px}.cell{width:42px;height:42px;background:#1e2a44;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}.wall{background:#060a14}.player{background:#facc15!important;box-shadow:0 0 18px #facc15}.treasure{background:#22c55e!important;animation:float 1s infinite alternate}.trail{background:#1a2740!important;color:#facc15;font-size:10px}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}.controls{margin-top:16px;display:grid;grid-template-columns:repeat(3,64px);gap:8px}.btn{width:64px;height:64px;background:#151e32;border:1px solid #2a3a5c;border-radius:14px;color:#fff;font-size:24px;cursor:pointer}.win{margin-top:14px;background:#facc15;color:#000;padding:12px 22px;border-radius:24px;font-weight:800;display:none}</style></head><body><div class="top"><div style="font-weight:800">🏴‍☠️ Treasure Hunt</div><div style="display:flex;gap:8px"><div class="badge badge2">👣 STEPS: <span id="steps">0</span></div><div class="badge">💰 <span id="coins">0</span>/5</div></div></div><div id="grid"></div><div class="win" id="winBox"></div><div class="controls"><div></div><button class="btn" onclick="move(-1,0)">↑</button><div></div><button class="btn" onclick="move(0,-1)">←</button><button class="btn" onclick="resetGame()">↻</button><button class="btn" onclick="move(0,1)">→</button><div></div><button class="btn" onclick="move(1,0)">↓</button><div></div></div><script>const ROWS=10,COLS=10;let player={r:0,c:0},steps=0,collected=0;let walls=new Set(),treasures=new Set(),visited=new Set();const wallPos=[[1,1],[1,2],[2,1],[3,3],[3,4],[3,5],[5,1],[5,5],[5,6],[6,5],[2,7],[4,7],[7,2],[7,3],[8,7],[8,2],[2,5]];const treasurePos=[[0,9],[9,0],[4,4],[9,9],[2,8]];wallPos.forEach(([r,c])=>walls.add(r+','+c));treasurePos.forEach(([r,c])=>treasures.add(r+','+c));const grid=document.getElementById('grid');const stepEl=document.getElementById('steps');const coinEl=document.getElementById('coins');const winBox=document.getElementById('winBox');function draw(){grid.innerHTML='';for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){let d=document.createElement('div');d.className='cell';let k=r+','+c;if(walls.has(k)){d.classList.add('wall');}else if(r===player.r&&c===player.c){d.classList.add('player');d.textContent='🧍';}else if(treasures.has(k)){d.classList.add('treasure');d.textContent='💎';}else if(visited.has(k)){d.classList.add('trail');d.textContent='•';}grid.appendChild(d);}}stepEl.textContent=steps;coinEl.textContent=collected;if(collected===5){winBox.style.display='block';winBox.textContent=`🎉 All Treasures Found in ${steps} Steps!`;}}function move(dr,dc){let nr=player.r+dr,nc=player.c+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;if(walls.has(nr+','+nc))return;visited.add(player.r+','+player.c);player.r=nr;player.c=nc;steps++;let k=nr+','+nc;if(treasures.has(k)){treasures.delete(k);collected++;}draw();}function resetGame(){player={r:0,c:0};steps=0;collected=0;visited=new Set();treasures=new Set();treasurePos.forEach(([r,c])=>treasures.add(r+','+c));winBox.style.display='none';draw();}window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(-1,0);if(e.key==='ArrowDown'||e.key==='s')move(1,0);if(e.key==='ArrowLeft'||e.key==='a')move(0,-1);if(e.key==='ArrowRight'||e.key==='d')move(0,1);});draw();</script></body></html>
