<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route Lab">
  <title>Route Lab</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <header class="topbar">
    <span class="brand">Route Lab</span>
    <span id="status" class="status status-idle">Idle</span>
  </header>

  <section id="panel" class="panel" aria-live="polite">
    <div id="hunt" class="hunt" hidden>
      <div class="hunt-compass" aria-hidden="true">
        <svg id="huntArrow" class="hunt-arrow" viewBox="0 0 24 24" width="30" height="30">
          <path d="M12 2 L19 20 L12 16 L5 20 Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="hunt-info">
        <span class="hunt-dist" id="huntDist">…</span>
        <span class="hunt-hint" id="huntHint">Tap Start to begin the hunt.</span>
      </div>
      <div class="hunt-side">
        <span class="hunt-score" title="Treasures found">💰 <span id="foundCount">0</span></span>
        <button id="rehideBtn" class="hunt-rehide" type="button" aria-label="Hide a new treasure">↻ New</button>
      </div>
    </div>
    <div class="readout">
      <div class="cell">
        <span class="label">Latitude</span>
        <span id="lat" class="value">—</span>
      </div>
      <div class="cell">
        <span class="label">Longitude</span>
        <span id="lng" class="value">—</span>
      </div>
      <div class="cell">
        <span class="label">Accuracy</span>
        <span id="acc" class="value">—</span>
      </div>
    </div>
    <p id="message" class="message" hidden></p>
    <div class="actions">
      <button id="startBtn" class="btn btn-primary" type="button">Start</button>
      <button id="recenterBtn" class="btn btn-secondary" type="button" hidden>Follow me</button>
    </div>
  </section>

  <div id="celebrate" class="celebrate" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle" hidden>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="celebrate-card">
      <div class="celebrate-emoji" aria-hidden="true">💰</div>
      <h2 id="celebrateTitle">Treasure found!</h2>
      <p id="celebrateText"></p>
      <button id="playAgainBtn" class="btn btn-primary" type="button">Hide another treasure</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="./app.js"></script>
  <script src="./treasure.js"></script>
</body>
</html>
