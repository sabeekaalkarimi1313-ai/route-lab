<!DOCTYPE html>
<html>
<head>
<title>GPS - Sabeeka Karimi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:Arial;text-align:center;padding:20px;background:#f0f8ff}.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto}button{background:#007bff;color:white;padding:12px 20px;border:none;border-radius:8px;font-size:16px}</style>
</head>
<body>
<h2>Week 5 GPS</h2>
<h3>Sabeeka Karimi</h3>
<div class="card">
<p id="s">Click to get GPS</p>
<p>Lat: <span id="lat">-</span></p>
<p>Lon: <span id="lon">-</span></p>
<button onclick="getGPS()">Get Location</button>
<div id="map"></div>
</div>
<script>
function getGPS(){
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude,lon=p.coords.longitude;
document.getElementById("lat").innerText=lat;
document.getElementById("lon").innerText=lon;
document.getElementById("s").innerText="Found!";
document.getElementById("map").innerHTML=`<a target=_blank href=https://www.google.com/maps?q=${lat},${lon}>Open Maps</a><br><br><iframe width=100% height=250 src=https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed></iframe>`;
})
}
</script>
</body>
</html>
